openapi: 3.0.3
info:
  title: BKUS Scheduling API
  description: >
    Smart scheduling API for the BKUS hospital system.
    Recommends appointment slots using patient profile matching
    and attendance-probability scoring.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development

security:
  - BearerAuth: []

paths:
  # -----------------------------------------------------------------------
  # POST /schedule — single-service scheduling
  # -----------------------------------------------------------------------
  /schedule:
    post:
      summary: Find recommended slots for a single service
      description: >
        Returns the earliest available slot and a ranked list of recommended
        slots for one service / specialist combination.  Slots are scored with
        a combined profile × attendance formula.
      operationId: schedule
      tags: [Scheduling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleRequest"
            example:
              patient_id: 12345
              patient_age: 7
              patient_address: "Limbová 1, Bratislava"
              hospital_id: 1
              service_id: 101
              specialist_id: null
              appointment_type: null
              slot_filter: "free"
              reception_mode: "0001"
              paid_visit: false
              excluded_dates: ["2026-03-10"]
      responses:
        "200":
          description: Slot recommendations computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
              example:
                patient_profile: "morning_near"
                results:
                  - service_id: 101
                    specialist_id: null
                    earliest:
                      slots:
                        - slot_id: 501
                          specialist_id: 10
                      date: "2026-03-05"
                      start_time: 480
                      end_time: 510
                      start_time_formatted: "08:00"
                      end_time_formatted: "08:30"
                      specialty_id: 3
                      hospital_id: 1
                      service_id: 101
                      appointment_type: null
                      score: 0.72
                      profile_match: true
                      profile_tier_level: 1
                      profile_window_rate: 0.85
                    recommended:
                      - slots:
                          - slot_id: 505
                            specialist_id: 10
                        date: "2026-03-06"
                        start_time: 540
                        end_time: 570
                        start_time_formatted: "09:00"
                        end_time_formatted: "09:30"
                        specialty_id: 3
                        hospital_id: 1
                        service_id: 101
                        appointment_type: null
                        score: 0.88
                        profile_match: true
                        profile_tier_level: 1
                        profile_window_rate: 0.92
                    total_slots_evaluated: 42
                    tier_used: 1
                    profile_match: true
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid or missing Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "403":
          description: Authorization header not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          description: >
            Service unavailable — scheduling database or day-time interactions
            are not loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # -----------------------------------------------------------------------
  # POST /schedule/multi — multi-service scheduling
  # -----------------------------------------------------------------------
  /schedule/multi:
    post:
      summary: Find combined plans for multiple services
      description: >
        Accepts 1-5 services and returns per-service earliest slots plus
        ranked multi-day plans that minimise the total number of hospital
        visits while maximising profile and attendance scores.
      operationId: scheduleMulti
      tags: [Scheduling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiScheduleRequest"
            example:
              patient_id: 12345
              patient_age: 7
              patient_address: "Limbová 1, Bratislava"
              hospital_id: 1
              slot_filter: "free"
              reception_mode: "0001"
              appointment_type: null
              paid_visit: null
              services:
                - service_id: 101
                  specialist_id: null
                - service_id: 205
                  specialist_id: 42
              excluded_dates: []
      responses:
        "200":
          description: Multi-service plans computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiScheduleResponse"
              example:
                patient_profile: "morning_near"
                earliest:
                  - slots:
                      - slot_id: 501
                        specialist_id: 10
                    date: "2026-03-05"
                    start_time: 480
                    end_time: 510
                    start_time_formatted: "08:00"
                    end_time_formatted: "08:30"
                    specialty_id: 3
                    hospital_id: 1
                    service_id: 101
                    appointment_type: null
                    score: 0.72
                    profile_match: true
                    profile_tier_level: 1
                    profile_window_rate: 0.85
                  - slots:
                      - slot_id: 610
                        specialist_id: 42
                    date: "2026-03-05"
                    start_time: 600
                    end_time: 630
                    start_time_formatted: "10:00"
                    end_time_formatted: "10:30"
                    specialty_id: 7
                    hospital_id: 1
                    service_id: 205
                    appointment_type: null
                    score: 0.65
                    profile_match: true
                    profile_tier_level: 2
                    profile_window_rate: 0.70
                plans:
                  - rank: 1
                    score: 0.81
                    visits:
                      - date: "2026-03-06"
                        slots:
                          - slots:
                              - slot_id: 505
                                specialist_id: 10
                            date: "2026-03-06"
                            start_time: 540
                            end_time: 570
                            start_time_formatted: "09:00"
                            end_time_formatted: "09:30"
                            specialty_id: 3
                            hospital_id: 1
                            service_id: 101
                            appointment_type: null
                            score: 0.88
                            profile_match: true
                            profile_tier_level: 1
                            profile_window_rate: 0.92
                          - slots:
                              - slot_id: 612
                                specialist_id: 42
                            date: "2026-03-06"
                            start_time: 600
                            end_time: 630
                            start_time_formatted: "10:00"
                            end_time_formatted: "10:30"
                            specialty_id: 7
                            hospital_id: 1
                            service_id: 205
                            appointment_type: null
                            score: 0.74
                            profile_match: true
                            profile_tier_level: 1
                            profile_window_rate: 0.80
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid or missing Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "403":
          description: Authorization header not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          description: >
            Service unavailable — scheduling database or day-time interactions
            are not loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # -----------------------------------------------------------------------
  # POST /schedule/regular — regular (recurring) scheduling
  # -----------------------------------------------------------------------
  /schedule/regular:
    post:
      summary: Schedule recurring appointments over a time span
      description: >
        Divides [start_date, until_date] into calendar work-weeks (Mon-Fri)
        and picks up to times_per_week slots per week using the patient's
        profile, with >=1 day spacing preference between visits.
        Supports single-service and multi-service scheduling with
        carry-forward logic. Returns partial results when insufficient
        slots are available.
      operationId: scheduleRegular
      tags: [Scheduling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegularScheduleRequest"
            example:
              patient_id: 12345
              patient_age: 7
              patient_address: "Riga"
              hospital_id: 1
              slot_filter: "free"
              reception_mode: "0001"
              appointment_type: null
              paid_visit: null
              services:
                - service_id: 138
              start_date: "2026-03-30"
              times_per_week: 1
              total_times: 6
              excluded_dates: []
      responses:
        "200":
          description: Regular schedule computed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegularScheduleResponse"
              example:
                patient_profile: "toddler_0-10km"
                start_date: "2026-03-30"
                times_per_week: 1
                total_times: 6
                total_visits: 6
                visits:
                  - date: "2026-03-30"
                    slots:
                      - slots:
                          - slot_id: 501
                            specialist_id: 10
                        date: "2026-03-30"
                        start_time: 721
                        end_time: 740
                        start_time_formatted: "12:01"
                        end_time_formatted: "12:20"
                        specialty_id: 4
                        hospital_id: 1
                        service_id: 138
                        appointment_type: 6
                        score: 0.5504
                        profile_match: true
                        profile_tier_level: 1
                        profile_window_rate: 0.64
                        label: "individual_best"
                        days_since_previous: null
                  - date: "2026-04-06"
                    slots:
                      - slots:
                          - slot_id: 520
                            specialist_id: 10
                        date: "2026-04-06"
                        start_time: 721
                        end_time: 740
                        start_time_formatted: "12:01"
                        end_time_formatted: "12:20"
                        specialty_id: 4
                        hospital_id: 1
                        service_id: 138
                        appointment_type: 6
                        score: 0.5504
                        profile_match: true
                        profile_tier_level: 1
                        profile_window_rate: 0.64
                        label: "individual_best"
                        days_since_previous: 7
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid or missing Bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "403":
          description: Authorization header not provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "503":
          description: >
            Service unavailable — scheduling database or day-time interactions
            are not loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

# =========================================================================
# Shared schemas
# =========================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Main API token passed via Authorization header.
        Configure with the MAIN_API_TOKEN environment variable.

  schemas:
    # ----- /schedule request -----
    ScheduleRequest:
      type: object
      required: [patient_age, patient_address]
      properties:
        patient_id:
          type: integer
          nullable: true
          description: >
            Internal patient ID. When provided, the system fetches visit
            history for attendance-probability estimation.
        patient_age:
          type: integer
          description: Patient age in years.
          example: 7
        patient_address:
          type: string
          description: Patient home address (used for distance profiling).
          example: "Limbová 1, Bratislava"
        hospital_id:
          type: integer
          default: 1
          description: Target hospital ID.
        service_id:
          type: integer
          nullable: true
          description: >
            Requested service ID. At least one of `service_id` or
            `specialist_id` must be provided.
        specialist_id:
          type: integer
          nullable: true
          description: >
            Preferred specialist ID. At least one of `service_id` or
            `specialist_id` must be provided.
        appointment_type:
          type: array
          items:
            type: integer
          nullable: true
          description: >
            Appointment type filter. Accepts a list of type IDs; slots are
            filtered by vizites_veids IN (...). A single integer is also
            accepted and coerced to a one-element list. Null or empty = no filter.
        slot_filter:
          type: string
          enum: [free, free_and_reserved]
          default: free
          description: >
            Which slot statuses to include.
            `free` — only unreserved slots;
            `free_and_reserved` — include tentatively reserved slots as well.
        reception_mode:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          default: "0001"
          description: >
            Reception mode code (pakalpojuma saņemšanas veids). Accepts a single code
            or a list of codes. Both zero-padded ("0002") and bare ("2")
            formats are expanded automatically. Default is "0001" (ambulatory).
            Known values: "0001", "0002", "0003", "0004".
        paid_visit:
          type: boolean
          nullable: true
          description: Filter for paid / insurance visits.
        excluded_dates:
          type: array
          items:
            type: string
            format: date
          default: []
          description: Dates to exclude from results (YYYY-MM-DD).

    # ----- /schedule response -----
    ScheduleResponse:
      type: object
      required: [patient_profile, results]
      properties:
        patient_profile:
          type: string
          description: >
            Resolved profile key describing the patient's preference bucket
            (e.g. `morning_near`, `afternoon_far`).
          example: morning_near
        results:
          type: array
          items:
            $ref: "#/components/schemas/ServiceResult"
          description: One entry per requested service/specialist combination.

    ServiceResult:
      type: object
      required:
        - service_id
        - specialist_id
        - earliest
        - recommended
        - total_slots_evaluated
        - tier_used
        - profile_match
      properties:
        service_id:
          type: integer
          nullable: true
        specialist_id:
          type: integer
          nullable: true
        earliest:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SlotResult"
          description: >
            The chronologically earliest available slot, or null when no
            slots match.
        recommended:
          type: array
          items:
            $ref: "#/components/schemas/SlotResult"
          description: >
            Slots ranked by combined profile × attendance score (descending).
        total_slots_evaluated:
          type: integer
          description: Total number of candidate slots considered.
        tier_used:
          type: integer
          nullable: true
          description: >
            Profile tier that produced results (1 = best match, 2 = relaxed,
            3 = most relaxed). Null when no profile matched.
        profile_match:
          type: boolean
          description: Whether a profile-matching slot was found.
        profile_match_reason:
          type: string
          nullable: true
          description: >
            Human-readable explanation when profile matching failed.
            Omitted from the response when null.

    # ----- /schedule/multi request -----
    MultiScheduleRequest:
      type: object
      required: [patient_age, patient_address, services]
      properties:
        patient_id:
          type: integer
          nullable: true
          description: >
            Internal patient ID. When provided, the system fetches visit
            history for attendance-probability estimation.
        patient_age:
          type: integer
          description: Patient age in years.
          example: 7
        patient_address:
          type: string
          description: Patient home address (used for distance profiling).
          example: "Limbová 1, Bratislava"
        hospital_id:
          type: integer
          default: 1
          description: Target hospital ID.
        slot_filter:
          type: string
          enum: [free, free_and_reserved]
          default: free
          description: >
            Which slot statuses to include.
            `free` — only unreserved slots;
            `free_and_reserved` — include tentatively reserved slots as well.
        reception_mode:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          default: "0001"
          description: >
            Reception mode code (pakalpojuma saņemšanas veids). Accepts a single code
            or a list of codes. Both zero-padded ("0002") and bare ("2")
            formats are expanded automatically. Default is "0001" (ambulatory).
            Known values: "0001", "0002", "0003", "0004".
        appointment_type:
          type: array
          items:
            type: integer
          nullable: true
          description: >
            Appointment type filter. Accepts a list of type IDs; slots are
            filtered by vizites_veids IN (...). A single integer is also
            accepted and coerced to a one-element list. Null or empty = no filter.
        paid_visit:
          type: boolean
          nullable: true
          description: Filter for paid / insurance visits.
        services:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/MultiServiceItem"
          description: >
            List of services to schedule together (1-5 entries).
        excluded_dates:
          type: array
          items:
            type: string
            format: date
          default: []
          description: Dates to exclude from results (YYYY-MM-DD).

    MultiServiceItem:
      type: object
      required: [service_id]
      properties:
        service_id:
          type: integer
          description: Service ID to schedule.
        specialist_id:
          type: integer
          nullable: true
          description: Optional preferred specialist for this service.

    # ----- /schedule/multi response -----
    MultiScheduleResponse:
      type: object
      required: [patient_profile, earliest, plans]
      properties:
        patient_profile:
          type: string
          description: Resolved profile key.
          example: morning_near
        earliest:
          type: array
          items:
            nullable: true
            allOf:
              - $ref: "#/components/schemas/SlotResult"
          description: >
            Per-service earliest slot (same order as the `services` array in
            the request). Null entries mean no slot was found for that service.
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
          description: >
            Ranked scheduling plans. Each plan covers all requested services,
            grouped into as few hospital visits (days) as possible.

    Plan:
      type: object
      required: [rank, score, visits]
      properties:
        rank:
          type: integer
          description: 1-based rank (1 = best).
        score:
          type: number
          format: float
          description: Aggregate plan score (higher is better).
        visits:
          type: array
          items:
            $ref: "#/components/schemas/PlanVisit"
          description: >
            Hospital visits that make up this plan, each on a distinct day.

    PlanVisit:
      type: object
      required: [date, slots]
      properties:
        date:
          type: string
          format: date
          description: Visit date (YYYY-MM-DD).
        slots:
          type: array
          items:
            $ref: "#/components/schemas/SlotResult"
          description: Appointment slots on this day.

    # ----- Shared slot -----
    SlotResult:
      type: object
      required:
        - slots
        - date
        - start_time
        - end_time
        - start_time_formatted
        - end_time_formatted
        - specialty_id
        - hospital_id
        - service_id
        - appointment_type
        - score
        - profile_match
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/SlotSpecialistPair"
          description: >
            One or more physical slot + specialist assignments that form
            this appointment window.
        date:
          type: string
          format: date
          description: Appointment date (YYYY-MM-DD).
          example: "2026-03-06"
        start_time:
          type: integer
          description: Start time as minutes since midnight.
          example: 540
        end_time:
          type: integer
          description: End time as minutes since midnight.
          example: 570
        start_time_formatted:
          type: string
          description: Start time in HH:MM format.
          example: "09:00"
        end_time_formatted:
          type: string
          description: End time in HH:MM format.
          example: "09:30"
        specialty_id:
          type: integer
          description: Medical specialty ID.
        hospital_id:
          type: integer
          description: Hospital ID.
        service_id:
          type: integer
          nullable: true
          description: Service ID (may be null for specialist-only queries).
        appointment_type:
          type: integer
          nullable: true
          description: Appointment type code.
        score:
          type: number
          format: float
          nullable: true
          description: >
            Combined score = profile_score × (0.3 + 0.7 × attendance_probability).
            Null when scoring is not applicable.
        profile_match:
          type: boolean
          description: Whether this slot falls within the patient's preferred window.
        profile_tier_level:
          type: integer
          nullable: true
          description: >
            Profile tier that matched (1 = best, 2 = relaxed, 3 = most relaxed).
            Null when there is no profile match.
        profile_window_rate:
          type: number
          format: float
          nullable: true
          description: >
            Raw profile rate for this time window before attendance adjustment.
            Null when there is no profile match.

    SlotSpecialistPair:
      type: object
      required: [slot_id, specialist_id]
      properties:
        slot_id:
          type: integer
          description: Database slot ID.
        specialist_id:
          type: integer
          description: Assigned specialist ID.

    # ----- /schedule/regular request -----
    RegularScheduleRequest:
      type: object
      required: [patient_age, patient_address, services, start_date, times_per_week, total_times]
      properties:
        patient_id:
          type: integer
          nullable: true
          description: Internal patient ID for attendance-probability estimation.
        patient_age:
          type: integer
          description: Patient age in years.
        patient_address:
          type: string
          description: Patient home address (used for distance profiling).
        hospital_id:
          type: integer
          default: 1
          description: Target hospital ID.
        slot_filter:
          type: string
          enum: [free, free_and_reserved]
          default: free
          description: Which slot statuses to include.
        reception_mode:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          default: "0001"
          description: >
            Reception mode code (pakalpojuma saņemšanas veids). Accepts a single code
            or a list of codes. Both zero-padded ("0002") and bare ("2")
            formats are expanded automatically. Default is "0001" (ambulatory).
            Known values: "0001", "0002", "0003", "0004".
        appointment_type:
          type: array
          items:
            type: integer
          nullable: true
          description: >
            Appointment type filter. Accepts a list of type IDs; slots are
            filtered by vizites_veids IN (...). A single integer is also
            accepted and coerced to a one-element list. Null or empty = no filter.
        paid_visit:
          type: boolean
          nullable: true
          description: Filter for paid / insurance visits.
        services:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/MultiServiceItem"
          description: Services to schedule (1-5 entries).
        excluded_dates:
          type: array
          items:
            type: string
            format: date
          default: []
          description: Dates to exclude (YYYY-MM-DD).
        start_date:
          type: string
          format: date
          description: Schedule start date (YYYY-MM-DD, today or future).
        times_per_week:
          type: integer
          minimum: 1
          maximum: 5
          description: >
            How many times per week the patient should visit (workdays only).
        total_times:
          type: integer
          minimum: 1
          description: >
            Total number of planned visits. Maximum is
            times_per_week × 52 (1-year horizon). The response may
            contain fewer visits (total_visits < total_times) when
            insufficient slots are available.

    # ----- /schedule/regular response -----
    RegularScheduleResponse:
      type: object
      required: [patient_profile, start_date, times_per_week, total_times, total_visits, visits]
      properties:
        patient_profile:
          type: string
          description: Resolved profile key.
        start_date:
          type: string
          format: date
          description: Echo of the requested start date.
        times_per_week:
          type: integer
          description: Echo of the requested times per week.
        total_times:
          type: integer
          description: Echo of the requested total visit count.
        total_visits:
          type: integer
          description: Total number of visits in the schedule.
        visits:
          type: array
          items:
            $ref: "#/components/schemas/RegularPlanVisit"
          description: Chronological list of scheduled visits.

    RegularPlanVisit:
      type: object
      required: [date, slots]
      properties:
        date:
          type: string
          format: date
          description: Visit date (YYYY-MM-DD).
        slots:
          type: array
          items:
            $ref: "#/components/schemas/RegularSlotResult"
          description: Appointment slots on this day.

    RegularSlotResult:
      allOf:
        - $ref: "#/components/schemas/SlotResult"
        - type: object
          required: [label, days_since_previous]
          properties:
            label:
              type: string
              enum: [combination, individual_best, earliest]
              description: >
                How this slot was placed: 'combination' (multi-service same-day),
                'individual_best' (best profile match), or 'earliest' (fallback/catch-up).
            days_since_previous:
              type: integer
              nullable: true
              description: >
                Days since the last visit with the same service_id.
                Null for the first occurrence of each service.

    # ----- Errors -----
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message.

    ValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
